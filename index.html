<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lee 的第一个网站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f1ea;
      color: #2b2b2b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      max-width: 560px;
      width: 100%;
      padding: 40px 36px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { line-height: 1.8; margin-bottom: 16px; color: #555; }
    ul { list-style: none; margin-bottom: 24px; }
    li { padding: 8px 0; border-bottom: 1px dashed #e5ded3; }
    li::before { content: "✓ "; color: #c46a3a; font-weight: bold; }
    button {
      background: #c46a3a;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #a85a30; }
    #count { margin-top: 12px; font-size: 14px; color: #888; }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好,我是 Lee 👋</h1>
    <p>这是我用 Git 管理的第一个网站。今天我完成了:</p>
    <ul>
      <li>安装 Git</li>
      <li>配置用户名和邮箱</li>
      <li>建好项目文件夹</li>
      <li>做出第一个网页</li>
    </ul>
    <button onclick="cheer()">给自己点个赞</button>
    <div id="count">还没点过赞</div>
  </div>

  <script>
    let n = 0;
    function cheer() {
      n++;
      document.getElementById("count").textContent = "已经点了 " + n + " 个赞 🎉";
    }
  </script>
</body>
</html>
